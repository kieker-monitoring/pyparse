[project]
name = "Pyparse"
version = "0.0.1"
description = "A static Python code parser that generates function call and data flow tables from target software's AST"
authors = [
    {name = "Daphné Larrivain",email = "daphne.larrivain@ecole.ensicaen.fr"}
]
license = {file = "LICENSE"}
requires-python = "==3.13.5"
dependencies = [
    termcolor==3.1.0,
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"
